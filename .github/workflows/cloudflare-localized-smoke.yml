name: Cloudflare Preview Localization Matrix

on:
  push:
    branches: [seo/merge-pdf-content-pilot]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Cloudflare Worker URL to smoke-test"
        required: true
        default: "https://seo-merge-pdf-content-pilot-updatedtools.rajeshkhandare788.workers.dev"

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  localized-route-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the commit being tested
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Wait for this commit's Cloudflare preview deployment
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const expected = context.sha.slice(0, 7);
            const prNumber = 23;
            const deadline = Date.now() + 15 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              });
              const body = comments.map((comment) => comment.body || '').join('\n');
              const rows = [...body.matchAll(/<tr>([\s\S]*?)<\/tr>/g)].map((match) => match[1]);
              const row = rows.find((candidate) => candidate.includes('>' + expected + '<'));
              if (row && row.includes('Build:</b> Success') && row.includes('Deployment:</b> Success')) {
                core.info('Cloudflare preview build and deployment succeeded for ' + expected);
                return;
              }
              if (row && row.includes('Build:</b> Failed')) {
                core.setFailed('Cloudflare preview build failed for ' + expected);
                return;
              }
              const lastSuccessful = rows.find((candidate) =>
                candidate.includes('Build:</b> Success') && candidate.includes('Deployment:</b> Success'));
              const deployedCommit = lastSuccessful?.match(/<td>([0-9a-f]{7})<\/td>/)?.[1];
              if (deployedCommit && deployedCommit !== expected) {
                const comparison = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: deployedCommit,
                  head: context.sha,
                });
                const changedFiles = comparison.data.files || [];
                if (changedFiles.length > 0 && changedFiles.every((file) => file.filename.startsWith('.github/workflows/'))) {
                  core.info('Only workflow files changed; using the last successful app preview ' + deployedCommit);
                  return;
                }
              }
              core.info('Waiting for Cloudflare preview deployment of ' + expected);
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            core.setFailed('Timed out waiting for Cloudflare preview deployment of ' + expected);

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify registry and localization foundation
        run: |
          npm run verify:tools
          npm run verify:international-seo
          npm run verify:tool-seo-quality

      - name: Test all 12 locales × 112 tools
        env:
          SMOKE_BASE_URL: ${{ github.event.inputs.base_url || 'https://seo-merge-pdf-content-pilot-updatedtools.rajeshkhandare788.workers.dev' }}
        run: npm run verify:localized-routes
      - name: Report localized route smoke result on the PR
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: \${{ job.status }}
        with:
          script: |
            const status = process.env.JOB_STATUS || 'unknown';
            const sha = context.sha.slice(0, 7);
            const verdict = status === 'success' ? 'GREEN' : 'FAILED';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 23,
              body: 'Cloudflare localized route smoke: ' + verdict + ' for commit ' + sha + '. Matrix target: 12 locales × 112 tools (1,344 routes).',
            });
