name: Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait briefly for Vercel deployment
        run: sleep 10

      - name: Browser smoke test all 87 tools
        env:
          SMOKE_BASE_URL: https://updatedtools-8kbg.vercel.app
        run: node scripts/browser-smoke.mjs
