name: Build Check
# Cloudflare branch build verification

on:
  push:
    branches: [main, cloudflare-test]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund


      - name: Verify tool registry and assets
        run: |
          npm run verify:tools
          test -s public/pdf.worker.min.mjs
          echo "PDF.js worker asset is present"

      - name: Verify international SEO foundation
        run: npm run verify:international-seo

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for Vercel deployment to match this commit
        if: github.ref == 'refs/heads/main'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          SMOKE_BASE_URL: https://updatedtools-8kbg.vercel.app
        run: |
          for i in {1..30}; do
            ACTUAL_COMMIT="$(curl -fsS --max-time 10 "$SMOKE_BASE_URL/api/build-version" | node -e "let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).commit)}catch{console.log('')}})")"
            echo "Deployment commit: $ACTUAL_COMMIT"
            if [ "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT" ]; then
              echo "Vercel deployment is serving $EXPECTED_COMMIT"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for Vercel deployment $EXPECTED_COMMIT"
          exit 1

      - name: Wait for Cloudflare deployment to match this commit
        if: github.ref == 'refs/heads/cloudflare-test'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          SMOKE_BASE_URL: https://updatedtools.rajeshkhandare788.workers.dev
        run: |
          for i in {1..60}; do
            ACTUAL_COMMIT="$(curl -fsS --max-time 10 "$SMOKE_BASE_URL/api/build-version?check=$EXPECTED_COMMIT" | node -e "let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).commit)}catch{console.log('')}})")"
            echo "Cloudflare deployment commit: $ACTUAL_COMMIT"
            if [ "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT" ]; then
              echo "Cloudflare deployment is serving $EXPECTED_COMMIT"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for Cloudflare deployment $EXPECTED_COMMIT"
          exit 1

      - name: Browser smoke test all 112 tools (Cloudflare)
        if: github.ref == 'refs/heads/cloudflare-test'
        env:
          SMOKE_BASE_URL: https://updatedtools.rajeshkhandare788.workers.dev
        run: node scripts/browser-smoke.mjs

      - name: Browser smoke test all 112 tools (Vercel)
        if: github.ref == 'refs/heads/main'
        env:
          SMOKE_BASE_URL: https://updatedtools-8kbg.vercel.app
        run: node scripts/browser-smoke.mjs

