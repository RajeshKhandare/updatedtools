name: Cloudflare PR Build Check

on:
  pull_request:
    branches: [cloudflare-test]

permissions:
  contents: read
  issues: read
  checks: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify tool registry and assets
        run: |
          npm run verify:tools
          test -s public/pdf.worker.min.mjs

      - name: Verify international SEO foundation
        run: npm run verify:international-seo

      - name: Validate localized route smoke test syntax
        run: node --check scripts/localized-route-smoke.mjs

      - name: Audit SEO content across all tool locales
        run: npm run verify:seo-content-quality

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://toolployee.com
        run: npm run build

      - name: Verify generated sitemap and robots
        run: |
          test -s out/sitemap.xml
          grep -q 'https://toolployee.com/tools/' out/sitemap.xml
          grep -q 'https://toolployee.com/sitemap.xml' out/robots.txt

      - name: Verify festival SEO, hreflang and affiliate placement
        run: npm run verify:festival-seo

      - name: Wait for the matching Cloudflare Workers preview deployment
        id: cloudflare-preview
        uses: actions/github-script@v7
        with:
          script: |
            const targetSha = context.payload.pull_request?.head?.sha || context.sha;
            const expected = targetSha.slice(0, 7);
            const deadline = Date.now() + 15 * 60 * 1000;

            while (Date.now() < deadline) {
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: targetSha,
                per_page: 100,
              });
              const workerBuild = checks.check_runs.find((check) =>
                check.name === 'Workers Builds: updatedtools' &&
                check.head_sha === targetSha
              );

              if (workerBuild?.status === 'completed' &&
                  workerBuild.conclusion !== 'success') {
                core.setFailed('Cloudflare Workers build failed for ' + expected);
                return;
              }

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                per_page: 100,
              });
              const cloudflareComments = comments.filter((comment) =>
                comment.user?.login === 'cloudflare-workers-and-pages[bot]'
              );

              let deploymentUrl = null;
              for (const comment of cloudflareComments) {
                const rows = (comment.body || '').split(/<tr>/i).slice(1);
                const matchingRow = rows.find((row) =>
                  row.includes(expected) &&
                  /Build:<\/b>\s*Success/i.test(row) &&
                  /Deployment:<\/b>\s*Success/i.test(row)
                );
                if (matchingRow) {
                  deploymentUrl = matchingRow.match(/href="(https:\/\/[^"]+\.workers\.dev)"/i)?.[1] || null;
                  if (deploymentUrl) break;
                }
              }

              if (workerBuild?.status === 'completed' &&
                  workerBuild.conclusion === 'success' &&
                  deploymentUrl) {
                core.setOutput('preview_url', deploymentUrl);
                core.info('Cloudflare build and deployment succeeded for ' + expected + '. Smoke tests will run against the exact commit preview: ' + deploymentUrl);
                return;
              }

              core.info('Waiting for exact-commit Cloudflare preview deployment for ' + expected +
                '. A successful build check alone is not sufficient.');
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }

            core.setFailed(
              'No successful Cloudflare workers.dev preview deployment was found for exact PR commit ' +
              expected + '. Production URLs are never used as a PR-preview substitute.'
            );

      - name: Smoke-test all 1,344 localized tool routes on the PR preview
        env:
          SMOKE_BASE_URL: ${{ steps.cloudflare-preview.outputs.preview_url }}
        run: npm run verify:localized-routes
