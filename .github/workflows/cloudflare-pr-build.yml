name: Cloudflare PR Build Check

on:
  pull_request:
    branches: [cloudflare-test]

permissions:
  contents: read
  issues: read
  checks: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify tool registry and assets
        run: |
          npm run verify:tools
          test -s public/pdf.worker.min.mjs

      - name: Verify international SEO foundation
        run: npm run verify:international-seo

      - name: Validate localized route smoke test syntax
        run: node --check scripts/localized-route-smoke.mjs

      # Run content analysis in CI without adding its cost to the Cloudflare app build.
      - name: Audit SEO content across all tool locales
        run: |
          npm run verify:seo-content-quality

      - name: Build
        run: npm run build

      - name: Verify festival SEO, hreflang and affiliate placement
        run: npm run verify:festival-seo

      - name: Wait for the matching Cloudflare Workers build
        id: cloudflare-preview
        uses: actions/github-script@v7
        with:
          script: |
            const targetSha = context.payload.pull_request?.head?.sha || context.sha;
            const expected = targetSha.slice(0, 7);
            const deadline = Date.now() + 15 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: targetSha,
                per_page: 100,
              });
              const workerBuild = data.check_runs.find((check) =>
                check.name === 'Workers Builds: updatedtools' && check.head_sha === targetSha);
              if (workerBuild?.status === 'completed') {
                if (workerBuild.conclusion !== 'success') {
                  core.setFailed('Cloudflare Workers build failed for ' + expected);
                  return;
                }
                // Cloudflare Workers previews do not expose the Pages-style Preview URL
                // comment in this repository. Use the live site only as a read-only
                // baseline smoke test; do not represent it as testing the PR preview.
                core.setOutput('preview_url', 'https://toolployee.com');
                core.info('Cloudflare Workers build succeeded for ' + expected + '. No isolated workers.dev preview URL is published by the integration; running read-only route smoke tests against the current live site as a baseline, not as PR-preview validation.');
                return;
              }
              core.info('Waiting for matching Cloudflare Workers build check for ' + expected);
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            core.setFailed('Timed out waiting for the matching Cloudflare Workers build check for ' + expected);

      - name: Smoke-test all 1,344 localized tool routes on Cloudflare
        env:
          SMOKE_BASE_URL: ${{ steps.cloudflare-preview.outputs.preview_url }}
        run: npm run verify:localized-routes
