name: Cloudflare PR Build Check

on:
  pull_request:
    branches: [cloudflare-test]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify tool registry and assets
        run: |
          npm run verify:tools
          test -s public/pdf.worker.min.mjs

      - name: Verify international SEO foundation
        run: npm run verify:international-seo

      - name: Validate localized route smoke test syntax
        run: node --check scripts/localized-route-smoke.mjs

      - name: Build
        run: npm run build

      - name: Verify festival SEO, hreflang and affiliate placement
        run: npm run verify:festival-seo

      - name: Smoke-test all 1,344 localized tool routes on Cloudflare
        env:
          SMOKE_BASE_URL: https://seo-merge-pdf-content-pilot-updatedtools.rajeshkhandare788.workers.dev
        run: npm run verify:localized-routes
