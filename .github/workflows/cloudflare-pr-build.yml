name: Cloudflare PR Build Check

on:
  pull_request:
    branches: [cloudflare-test]

permissions:
  contents: read
  issues: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify tool registry and assets
        run: |
          npm run verify:tools
          test -s public/pdf.worker.min.mjs

      - name: Verify international SEO foundation
        run: npm run verify:international-seo

      - name: Validate localized route smoke test syntax
        run: node --check scripts/localized-route-smoke.mjs

      # Run content analysis in CI without adding its cost to the Cloudflare app build.
      - name: Audit SEO content across all tool locales
        run: |
          npm run verify:seo-content-quality

      - name: Build
        run: npm run build

      - name: Verify festival SEO, hreflang and affiliate placement
        run: npm run verify:festival-seo

      - name: Wait for the matching Cloudflare preview deployment
        id: cloudflare-preview
        uses: actions/github-script@v7
        with:
          script: |
            const targetSha = context.payload.pull_request?.head?.sha || context.sha;
            const expected = targetSha.slice(0, 7);
            const { data: changedFiles } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request?.number || context.issue.number,
              per_page: 100,
            });
            const nonRuntimeOnly = changedFiles.length > 0 && changedFiles.every((file) =>
              file.filename.startsWith('.github/workflows/') ||
              file.filename === 'scripts/localized-route-smoke.mjs' ||
              file.filename === 'scripts/generate-localized-tool-seo.ts');
            if (nonRuntimeOnly) {
              core.setOutput('preview_url', 'https://toolployee.com');
              core.info('Only CI or translation-generator files changed; application runtime is unchanged. Smoke-testing the current production site.');
              return;
            }
            const deadline = Date.now() + 15 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request?.number || context.issue.number,
                per_page: 100,
              });
              const previewComment = comments
                .filter((comment) => (comment.body || '').includes('Preview URL'))
                .sort((a, b) => new Date(b.updated_at).getTime() - new Date(a.updated_at).getTime())[0];
              const body = previewComment?.body || '';
              const rows = body.split('<tr>').slice(1).map((chunk) => chunk.split('</tr>')[0]);
              const row = rows.find((candidate) => candidate.includes('>' + expected + '<'));
              if (row && row.includes('Build:</b> Success') && row.includes('Deployment:</b> Success')) {
                const previewUrl = row.match(/href="(https:\/\/[^\"]+workers\.dev)"/)?.[1];
                if (!previewUrl) {
                  core.setFailed('Cloudflare preview succeeded but its commit-specific URL could not be found for ' + expected);
                  return;
                }
                core.setOutput('preview_url', previewUrl);
                core.info('Cloudflare preview build and deployment succeeded for ' + expected + ': ' + previewUrl);
                return;
              }
              if (row && row.includes('Build:</b> Failed')) {
                core.setFailed('Cloudflare preview build failed for ' + expected);
                return;
              }
              const lastSuccessful = rows.find((candidate) =>
                candidate.includes('Build:</b> Success') && candidate.includes('Deployment:</b> Success'));
              const deployedCommit = lastSuccessful?.match(/<tt>([0-9a-f]{7})<\/tt>/)?.[1];
              if (deployedCommit && deployedCommit !== expected) {
                const comparison = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: deployedCommit,
                  head: targetSha,
                });
                const changedFiles = comparison.data.files || [];
                const onlyTestOrWorkflowChanges = changedFiles.length > 0 && changedFiles.every((file) =>
                  file.filename.startsWith('.github/workflows/') ||
                  file.filename === 'scripts/localized-route-smoke.mjs' ||
                  file.filename === 'scripts/generate-localized-tool-seo.ts');
                if (onlyTestOrWorkflowChanges) {
                  const previewUrl = lastSuccessful?.match(/href="(https:\/\/[^\"]+workers\.dev)"/)?.[1];
                  if (!previewUrl) {
                    core.setFailed('Could not find the last successful Cloudflare preview URL');
                    return;
                  }
                  core.setOutput('preview_url', previewUrl);
                  core.info('No application files changed since successful Cloudflare preview ' + deployedCommit + '; testing ' + previewUrl);
                  return;
                }
              }
              core.info('Waiting for Cloudflare preview deployment of ' + expected);
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }
            core.setFailed('Timed out waiting for Cloudflare preview deployment of ' + expected);

      - name: Smoke-test all 1,344 localized tool routes on Cloudflare
        env:
          SMOKE_BASE_URL: ${{ steps.cloudflare-preview.outputs.preview_url }}
        run: npm run verify:localized-routes

      - name: Browser smoke test all 112 tools on Cloudflare preview
        env:
          SMOKE_BASE_URL: ${{ steps.cloudflare-preview.outputs.preview_url }}
        run: node scripts/browser-smoke.mjs
